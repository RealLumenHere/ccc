<!doctype html>
<meta charset="utf-8" />
<style>
  :root { color-scheme: dark;
    /* 2026-09-26 REDESIGN v3 (reviewing agent's proposal): lighter charcoal
       canvas replaces the near-black v2 palette (#090a0f -> #1D1F23), same
       violet active accent. Verified against the v3 pane/composer bg. */
    --bg:#1D1F23; --text:#e4e4e7; --dim:#8b8b93;
    --surf:#26292E; --surf-h:#303438; --border:#3A3E43;
    --active-bg:#303438; --active-bd:#a855f7; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font: 11px/1.3 'OpenDyslexic', 'Atkinson Hyperlegible', -apple-system, 'Segoe UI', Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; }
  .bar { display: flex; align-items: center; height: 28px; gap: 6px; padding: 0 6px; }
  button { background: var(--surf); color: var(--text); border: 1px solid var(--border); border-radius: 5px;
    height: 20px; padding: 0 7px; cursor: pointer; font: inherit; }
  button:hover { background: var(--surf-h); }
  button:disabled { opacity: 0.4; cursor: default; }
  .icon { width: 20px; padding: 0; font-size: 13px; line-height: 1; }
  #tabs { display: flex; align-items: center; gap: 4px; flex: 1; overflow: hidden; }
  .chip { display: flex; align-items: center; gap: 6px; max-width: 200px;
    height: 20px; padding: 0 5px 0 8px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--surf); color: var(--text); cursor: pointer; white-space: nowrap; font-weight: 700; }
  .chip:hover { background: var(--surf-h); }
  .chip .t { overflow: hidden; text-overflow: ellipsis; }
  .chip .dot { width: 7px; height: 7px; min-width: 7px; border-radius: 2px;
    border: 1px solid rgba(255,255,255,0.35); }
  .chip.active { background: var(--active-bg); border-color: var(--active-bd); color: #e8e8e8; }
  .chip.offscreen { opacity: 0.5; }
  .chip.dragging { opacity: 0.35; }
  .chip .x { opacity: 0.5; font-size: 11px; }
  .chip .x:hover { opacity: 1; color: #e0885a; }
  /* Per-tile status dot (2026-10-23, wq#4561): idle / working / continue /
     limited / error. Fed by automations.js statusTick via main.js. */
  .chip .st { width: 7px; height: 7px; min-width: 7px; border-radius: 50%; background: #59c059; }
  .chip .st.working { background: #eeb32b; animation: ccc-pulse 1s ease-in-out infinite; }
  .chip .st.continue { background: #3cc2dd; animation: ccc-pulse 1s ease-in-out infinite; }
  .chip .st.limited { background: #f97316; }
  .chip .st.error { background: #e85e8c; }
  @keyframes ccc-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
  /* Ctrl+click selection for broadcast; double-click = solo */
  .chip.selected { box-shadow: inset 0 0 0 1px #3cc2dd; border-color: #3cc2dd; }
  .chip.solo { border-style: dashed; }
  .pager { display: flex; align-items: center; gap: 4px; color: var(--dim); }
  .pager .rng { min-width: 54px; text-align: center; }
  .sp { flex: 0 0 1px; height: 16px; background: var(--border); margin: 0 2px; }
  /* Broadcast box (wq#4561): hidden until toggled; main.js grows the topbar
     view to make room (ccc:topbarHeight) and shrinks it back on close. */
  #bc { display: none; padding: 4px 6px 6px; gap: 6px; flex-direction: column; }
  #bc.open { display: flex; }
  #bc textarea { width: 100%; height: 74px; resize: none; background: var(--surf); color: var(--text);
    border: 1px solid var(--border); border-radius: 5px; padding: 5px 7px; font: inherit; -webkit-user-select: text; user-select: text; }
  #bc .row { display: flex; align-items: center; gap: 6px; color: var(--dim); }
  #bc .row .n { color: var(--text); font-weight: 700; }
  #bc .spacer { flex: 1; }
  #bcbtn.on { border-color: #3cc2dd; color: #3cc2dd; }
</style>

<div class="bar">
  <button class="icon" id="add" title="New chat (Ctrl+T)">＋</button>
  <div class="sp"></div>
  <div id="tabs"></div>
  <div class="sp"></div>
  <div class="pager">
    <button class="icon" id="prev" title="Scroll left (Ctrl+←)">‹</button>
    <span class="rng" id="rng">–</span>
    <button class="icon" id="next" title="Scroll right (Ctrl+→)">›</button>
  </div>
  <div class="sp"></div>
  <button id="bcbtn" title="Broadcast a prompt to the selected tiles (Ctrl+click chips to select)">⇶ broadcast</button>
  <button id="side" title="Toggle sidebar in active chat">☰ sidebar</button>
</div>
<div id="bc">
  <textarea id="bctext" placeholder="Type once — goes to every selected tile (Ctrl+click chips to select). Ctrl+Enter sends."></textarea>
  <div class="row">
    <span><span class="n" id="bcn">0</span> selected</span>
    <span class="spacer"></span>
    <button id="bcall" title="Select every idle tile">select idle</button>
    <button id="bcnone" title="Clear selection">clear</button>
    <button id="bcstage" title="Put the text in each selected composer without sending">stage only</button>
    <button id="bcsend" title="Inject and send to each selected tile, staggered">send to selected</button>
    <button class="icon" id="bcclose" title="Close">×</button>
  </div>
</div>

<script>
  const $ = (s) => document.querySelector(s);
  const COLOR_HEX = { green:'#22c55e', red:'#ef4444', black:'#a1a1aa', yellow:'#eab308', blue:'#3b82f6' }; // 'gray' removed 2026-09-26; 'black' matched to the tile accent's neutral (2026-09-26 v3) rather than true #000, which read as invisible on a dark dot
  const STATUS_TITLE = { idle:'idle', working:'working…', continue:'tool-limit pause (auto-continue)', limited:'rate-limited', error:'error' };
  const selected = new Set();   // tab ids chosen for broadcast (Ctrl+click)
  let lastSt = null;
  $('#add').onclick  = () => window.ccc.send('ccc:newTab');
  $('#prev').onclick = () => window.ccc.send('ccc:page', -1);
  $('#next').onclick = () => window.ccc.send('ccc:page', +1);
  $('#side').onclick = () => window.ccc.send('ccc:toggleSidebar');

  // ---- broadcast box (wq#4561) ----
  const BC_H = 150;   // keep in sync with CFG.BROADCAST_TOPBAR_HEIGHT
  function bcOpen(open) {
    $('#bc').classList.toggle('open', open);
    $('#bcbtn').classList.toggle('on', open);
    window.ccc.send('ccc:topbarHeight', open ? BC_H : 0);
    if (open) setTimeout(() => $('#bctext').focus(), 50);
  }
  function bcCount() { $('#bcn').textContent = String(selected.size); }
  function bcFire(send) {
    const text = $('#bctext').value.trim();
    if (!text || !selected.size) return;
    window.ccc.send('ccc:broadcast', { text, ids: [...selected], send });
    if (send) $('#bctext').value = '';
  }
  $('#bcbtn').onclick = () => bcOpen(!$('#bc').classList.contains('open'));
  $('#bcclose').onclick = () => bcOpen(false);
  $('#bcsend').onclick = () => bcFire(true);
  $('#bcstage').onclick = () => bcFire(false);
  $('#bcnone').onclick = () => { selected.clear(); bcCount(); if (lastSt) render(lastSt); };
  $('#bcall').onclick = () => {
    if (!lastSt) return;
    selected.clear();
    lastSt.tabs.forEach((t) => { if ((t.status || 'idle') === 'idle') selected.add(t.id); });
    bcCount(); render(lastSt);
  };
  $('#bctext').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); bcFire(true); }
    if (e.key === 'Escape') { e.preventDefault(); bcOpen(false); }
  });

  function render(st) {
    const box = $('#tabs');
    box.innerHTML = '';
    // drop selections for tabs that no longer exist
    for (const id of [...selected]) { if (!st.tabs.some((t) => t.id === id)) selected.delete(id); }
    bcCount();
    st.tabs.forEach((t, i) => {
      const onscreen = st.soloId != null ? (t.id === st.soloId) : (i >= st.pageOffset && i < st.pageOffset + st.columns);
      const chip = document.createElement('div');
      chip.className = 'chip' + (t.id === st.activeId ? ' active' : '') + (onscreen ? '' : ' offscreen')
        + (selected.has(t.id) ? ' selected' : '') + (t.id === st.soloId ? ' solo' : '');
      chip.title = (STATUS_TITLE[t.status] || t.status || 'idle') + ' — Ctrl+click: select for broadcast · double-click: solo · right-click: copy last reply';
      const sdot = document.createElement('span');
      sdot.className = 'st ' + (t.status || 'idle');
      chip.appendChild(sdot);
      if (t.color && COLOR_HEX[t.color]) {
        const dot = document.createElement('span');
        dot.className = 'dot'; dot.style.background = COLOR_HEX[t.color];
        chip.appendChild(dot);
      }
      const label = document.createElement('span');
      label.className = 't'; label.textContent = t.title;
      const x = document.createElement('span');
      x.className = 'x'; x.textContent = '×';
      x.onclick = (e) => { e.stopPropagation(); window.ccc.send('ccc:closeTab', t.id); };
      chip.onclick = (e) => {
        if (e.ctrlKey || e.metaKey) {            // toggle selection for broadcast
          if (selected.has(t.id)) selected.delete(t.id); else selected.add(t.id);
          bcCount(); render(st); return;
        }
        window.ccc.send('ccc:focusTab', t.id);
      };
      chip.ondblclick = (e) => { e.preventDefault(); window.ccc.send('ccc:toggleSolo', t.id); };
      chip.oncontextmenu = (e) => { e.preventDefault(); window.ccc.send('ccc:copyLast', t.id); };
      chip.draggable = true;
      chip.ondragstart = (e) => { e.dataTransfer.setData('text/plain', String(t.id)); e.dataTransfer.effectAllowed = 'move'; chip.classList.add('dragging'); };
      chip.ondragend = () => chip.classList.remove('dragging');
      chip.ondragover = (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; };
      chip.ondrop = (e) => {
        e.preventDefault(); e.stopPropagation();
        const dragId = Number(e.dataTransfer.getData('text/plain'));
        if (!dragId || dragId === t.id) return;
        const r = chip.getBoundingClientRect();
        const after = (e.clientX - r.left) > r.width / 2;
        let target = i + (after ? 1 : 0);
        const from = st.tabs.findIndex((x) => x.id === dragId);
        if (from !== -1 && from < target) target -= 1;
        window.ccc.send('ccc:moveTab', { id: dragId, toIndex: target });
      };
      chip.appendChild(label); chip.appendChild(x);
      box.appendChild(chip);
    });
    box.ondragover = (e) => { e.preventDefault(); };
    box.ondrop = (e) => {
      const dragId = Number(e.dataTransfer.getData('text/plain'));
      if (dragId) window.ccc.send('ccc:moveTab', { id: dragId, toIndex: st.tabs.length - 1 });
    };
    const first = st.pageOffset + 1;
    const last = Math.min(st.pageOffset + st.columns, st.tabs.length);
    $('#rng').textContent = st.soloId != null ? 'solo' : (st.tabs.length ? `${first}–${last}/${st.tabs.length}` : '–');
    $('#prev').disabled = st.soloId != null || st.pageOffset <= 0;
    $('#next').disabled = st.soloId != null || st.pageOffset >= st.maxOffset;
  }
  window.ccc.on('tabs', (st) => { lastSt = st; render(st); });
</script>
