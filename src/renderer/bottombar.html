<!doctype html>
<meta charset="utf-8" />
<style>
  :root { color-scheme: dark;
    /* 2026-09-26 REDESIGN v3: matches topbar.html's lighter charcoal canvas
       exactly (#090a0f -> #1D1F23). Accent colors (accent/warn/hot) stay
       unchanged — already bright enough for the new, lighter bg too
       (re-verified: 4.8-8.9:1). */
    --bg:#1D1F23; --text:#e4e4e7; --dim:#8b8b93;
    --track:#3A3E43; --accent:#3cc2dd; --warn:#eeb32b; --hot:#e85e8c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font: 11px/1.3 'OpenDyslexic', 'Atkinson Hyperlegible', -apple-system, 'Segoe UI', Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; }
  .bar { display: flex; align-items: center; height: 30px; gap: 14px; padding: 0 12px; }
  .metric { display: flex; align-items: center; gap: 6px; }
  .metric .lbl { color: var(--text); font-weight: 400; }
  .metric .val { color: var(--text); font-variant-numeric: tabular-nums; font-weight: 700; }
  .track { width: 60px; height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .fill.warn { background: var(--warn); }
  .fill.hot { background: var(--hot); }
  .spacer { flex: 1; }
  .status { color: var(--dim); }
  .status.limit { color: var(--warn); }
  .status.resume { color: #59c059; }
  /* wq#4561: tile tally + fleet dots */
  .tiles .k { color: var(--dim); margin-left: 4px; }
  .tiles .k b { color: var(--text); }
  .tiles .k.working b { color: var(--warn); }
  .tiles .k.limited b { color: #f97316; }
  .tiles .k.error b { color: var(--hot); }
  #fleet { display: flex; align-items: center; gap: 3px; }
  #fleet .nd { width: 7px; height: 7px; border-radius: 50%; background: #59c059; }
  #fleet .nd.off { background: #e85e8c; }
  #fleet .nd.na { background: var(--track); }
  .note { color: var(--dim); max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>

<div class="bar">
  <div class="metric" id="m-session">
    <span class="lbl">Session</span>
    <span class="track"><span class="fill" id="f-session"></span></span>
    <span class="val" id="v-session">—</span>
  </div>
  <div class="metric" id="m-weekly">
    <span class="lbl">Weekly</span>
    <span class="track"><span class="fill" id="f-weekly"></span></span>
    <span class="val" id="v-weekly">—</span>
  </div>
  <div class="metric" id="m-fable">
    <span class="lbl">Fable</span>
    <span class="track"><span class="fill" id="f-fable"></span></span>
    <span class="val" id="v-fable">—</span>
  </div>
  <div class="metric tiles" id="tiles"><span class="lbl">Tiles</span><span class="k"><b id="t-total">–</b></span></div>
  <div class="note" id="note"></div>
  <div class="spacer"></div>
  <div class="metric sys"><span class="lbl">CPU</span><span class="track"><span class="fill" id="f-cpu"></span></span><span class="val" id="s-cpu">—</span></div>
  <div class="metric sys"><span class="lbl">Temp</span><span class="val" id="s-temp">—</span></div>
  <div class="metric sys"><span class="lbl">Mem</span><span class="track"><span class="fill" id="f-mem"></span></span><span class="val" id="s-mem">—</span></div>
  <div class="metric sys"><span class="lbl">Disk</span><span class="track"><span class="fill" id="f-disk"></span></span><span class="val" id="s-disk">—</span></div>
  <div class="spacer"></div>
  <div class="metric ds"><span class="lbl">DeepSeek</span><span class="val" id="ds-bal">—</span></div>
  <div class="metric ds"><span class="lbl">today</span><span class="val" id="ds-today">—</span></div>
  <div class="metric ds"><span class="lbl">hr</span><span class="val" id="ds-hour">—</span></div>
  <div class="metric ds"><span class="lbl">mo</span><span class="val" id="ds-month">—</span></div>
  <div class="metric ds"><span class="lbl">yr</span><span class="val" id="ds-year">—</span></div>
  <div class="metric ds"><span class="lbl">last</span><span class="val" id="ds-last">—</span></div>
  <div class="metric"><span class="lbl">Fleet</span><span id="fleet" title="Lumen messenger /nodes"></span><span class="val" id="fl-aq" title="open alerts (aq)"></span></div>
  <div class="status" id="status"></div>
</div>

<script>
  const $ = (s) => document.querySelector(s);
  function paint(prefix, obj) {
    if (!obj || typeof obj.pct !== 'number') return;
    const f = $('#f-' + prefix), v = $('#v-' + prefix);
    f.style.width = Math.min(100, obj.pct) + '%';
    f.className = 'fill' + (obj.pct >= 90 ? ' hot' : obj.pct >= 70 ? ' warn' : '');
    v.textContent = obj.pct + '%' + (obj.reset ? ' · ' + obj.reset : '');
  }
  window.ccc.on('usage', (u) => {
    if (!u) return;
    paint('session', u.session);
    paint('weekly', u.weekly);
    paint('fable', u.fableWeekly);
    // u.raw arrives before field-binding; show a subtle hint it's flowing
    if (u.raw && !u.session && !u.weekly) $('#status').textContent = 'usage stream detected (unbound)';
  });
  window.ccc.on('limit', (d) => {
    const s = $('#status'); s.className = 'status limit';
    s.textContent = 'Limit hit' + (d.resumeInSec ? ` · auto-resume ~${Math.round(d.resumeInSec/60)}m` : '') ;
  });
  window.ccc.on('deepseek', (d) => {
    if (!d) return;
    if (d.ok === false) { $('#ds-bal').textContent = 'offline'; return; }
    const put = (id, v) => { if (v != null) $('#' + id).textContent = v; };
    put('ds-bal', d.balance);
    put('ds-today', d.today);
    put('ds-hour', d.hour);
    put('ds-month', d.month);
    put('ds-year', d.year);
    put('ds-last', d.last);
  });
  window.ccc.on('sysstats', (d) => {
    if (!d) return;
    const setBar = (prefix, pct) => {
      const f = $('#f-' + prefix), v = $('#s-' + prefix);
      if (pct == null) { if (v) v.textContent = '—'; return; }
      if (f) { f.style.width = Math.min(100, pct) + '%'; f.className = 'fill' + (pct >= 90 ? ' hot' : pct >= 70 ? ' warn' : ''); }
      if (v) v.textContent = pct + '%';
    };
    setBar('cpu', d.cpu); setBar('mem', d.mem); setBar('disk', d.disk);
    const t = $('#s-temp');
    if (t) {
      if (d.temp == null) { t.textContent = '—'; t.style.color = ''; }
      else { t.textContent = d.temp + '°C'; t.style.color = d.temp >= 85 ? '#e85e8c' : d.temp >= 70 ? '#eeb32b' : '#e4e4e7'; }
    }
  });
  // wq#4561: per-tile status tally + one-line notes (capture/broadcast)
  let noteTimer = null;
  window.ccc.on('tileStatus', (d) => {
    if (!d) return;
    if (d.counts) {
      const c = d.counts, order = ['working', 'continue', 'limited', 'error'];
      let html = '<b id="t-total">' + (d.total || 0) + '</b>';
      for (const k of order) if (c[k]) html += '</span><span class="k ' + k + '">' + k + ' <b>' + c[k] + '</b>';
      $('#tiles').innerHTML = '<span class="lbl">Tiles</span><span class="k">' + html + '</span>';
    }
    if (d.note) {
      const n = $('#note'); n.textContent = d.note;
      clearTimeout(noteTimer); noteTimer = setTimeout(() => { n.textContent = ''; }, 12000);
    }
  });
  // wq#4561: fleet dots from Lumen /nodes + aq open count
  window.ccc.on('fleet', (d) => {
    const box = $('#fleet'); if (!box || !d) return;
    box.innerHTML = '';
    if (!d.ok) { const s = document.createElement('span'); s.className = 'nd na'; s.title = 'Lumen unreachable'; box.appendChild(s); }
    (d.nodes || []).forEach((n) => {
      const s = document.createElement('span');
      s.className = 'nd' + (n.online ? '' : ' off');
      s.title = n.name + (n.online ? ' · ' + (n.latency != null ? Math.round(n.latency * 1000) / 1000 + 's' : 'up') + (n.cpu ? ' · cpu ' + n.cpu + '%' : '') : ' · OFFLINE');
      box.appendChild(s);
    });
    $('#fl-aq').textContent = d.aqOpen != null ? 'aq ' + d.aqOpen : '';
  });
  window.ccc.on('resumed', () => {
    const s = $('#status'); s.className = 'status resume'; s.textContent = 'Resumed';
    setTimeout(() => { s.textContent = ''; s.className = 'status'; }, 8000);
  });
</script>
